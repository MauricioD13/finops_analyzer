[tool.poetry]
name = "finops-analyzer"
version = "0.1.0"
description = "Bill data from major cloud provider into FOCUS framework"
authors = ["Mauricio Cuello <mauricio.cuello@tribuops.com>"]
license = "BSL"
readme = "README.md"
packages = [{include = "finops_analyzer"}]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
fastapi = {extras = ["standard"], version = ">=0.117.1,<0.118.0"}
jinja2 = ">=3.1.6,<4.0.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
