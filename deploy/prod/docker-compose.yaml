---
services:
  finops-analyzer:
    build:
      context: ../..
      dockerfile: deploy/prod/dockerfile.finops_analyzer.yaml
    container_name: finops-analyzer
    ports:
      - "8000:8000"
    volumes:
      # Persist input/output directories for file processing
      - finops-input:/app/files/uploads
      - finops-output:/app/files/downloads
      - finops-logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL}
      - OUTPUT_DIR=${OUTPUT_DIR}
      - INPUT_DIR=${INPUT_DIR}
      - LOGS_DIR=${LOGS_DIR}
      - SENTRY_URL=${SENTRY_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  finops-input:
    driver: local
  finops-output:
    driver: local
  finops-logs:
    driver: local
