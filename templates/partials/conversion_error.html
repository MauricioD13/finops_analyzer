<div class="bg-gradient-to-br from-red-500/20 to-rose-500/20 border border-red-500/30 rounded-xl p-6 animate-fade-in backdrop-blur-sm">
  <div class="flex items-start space-x-4">
    <div class="flex-shrink-0">
      <svg class="w-12 h-12 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
    </div>
    <div class="flex-1">
      <h4 class="text-xl font-semibold text-red-400 mb-2">Conversion Failed</h4>
      <p class="text-gray-300 mb-4">There was an error converting your file. Please check the file format and try again.</p>
      {% if error %}
      <div class="bg-black/30 rounded-lg p-3 mb-4">
        <p class="text-sm text-red-300 font-mono">{{ error }}</p>
      </div>
      {% endif %}
      <button
        onclick="location.reload()"
        class="inline-flex items-center px-6 py-3 bg-gradient-to-r from-red-500 to-rose-600 hover:from-red-600 hover:to-rose-700 rounded-lg text-white font-semibold transition-all duration-300 shadow-lg">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
        Try Again
      </button>
    </div>
  </div>
</div>
